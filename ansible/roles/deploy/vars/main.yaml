---
email_exporter_repo: https://github.com/maneyko/email-exporter.git
email_exporter_root: /opt/email-exporter
email_exporter_conf: /etc/email-exporter
email_exporter_user: email-exporter

# Region of the bucket the caller names in config.bucket_name.
email_exporter_aws_region: us-east-2

# The account TOML names the file it is written to, so the list of documents
# needs no keys alongside it.
email_exporter_username_re: 'username\s*=\s*"([^"]+)"'

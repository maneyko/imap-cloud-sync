---
# TODO: switch to an HTTPS URL once this repo is public, which drops the agent
# forwarding an SSH clone needs.
imap_cloud_sync_repo: git@github.com:maneyko/imap-cloud-sync.git
imap_cloud_sync_root: /opt/imap-cloud-sync
imap_cloud_sync_conf: /etc/imap-cloud-sync
imap_cloud_sync_user: imap-cloud-sync

# Region of the bucket the caller names in config.bucket_name.
imap_cloud_sync_aws_region: us-east-2

# The account TOML names the file it is written to, so the list of documents
# needs no keys alongside it.
imap_cloud_sync_username_re: 'username\s*=\s*"([^"]+)"'

---
- name: Create imap-s3-uploader user
  register: app_user
  user:
    name: "{{ imap_s3_uploader_user }}"
    home: /var/lib/{{ imap_s3_uploader_user }}
    shell: /usr/sbin/nologin
    system: true
    comment: User for the IMAP to S3 mail archiver

- name: Install uv
  include_role:
    name: maneyko.roles.uv
  vars:
    uv_users: ["{{ imap_s3_uploader_user }}"]

- name: Clone imap-s3-uploader repo
  git:
    accept_hostkey: true
    repo: "{{ imap_s3_uploader_repo }}"
    version: "{{ config.version | default('main') }}"
    dest: "{{ imap_s3_uploader_root }}"

- name: Set imap-s3-uploader file permissions
  changed_when: false
  shell: |
    chown -R {{ config.owner }}:{{ imap_s3_uploader_user }} {{ imap_s3_uploader_root }}
    find {{ imap_s3_uploader_root }} -type d -exec chmod 2750 {} +
    find {{ imap_s3_uploader_root }} -type f -exec chmod g-w,o= {} +

- name: Create imap-s3-uploader secrets directory
  file:
    state: directory
    path: "{{ imap_s3_uploader_conf }}/secrets"
    owner: "{{ config.owner }}"
    group: "{{ imap_s3_uploader_user }}"
    mode: '0750'

- name: Write imap-s3-uploader account secrets
  loop: "{{ secrets.users }}"
  no_log: true
  copy:
    content: "{{ item }}"
    dest: "{{ imap_s3_uploader_conf }}/secrets/{{ (item | regex_findall(imap_s3_uploader_username_re)) | first }}.toml"
    owner: "{{ config.owner }}"
    group: "{{ imap_s3_uploader_user }}"
    mode: '0640'

- name: Write imap-s3-uploader environment
  copy:
    dest: "{{ imap_s3_uploader_conf }}/environment"
    content: |
      BUCKET_NAME={{ config.bucket_name }}
    owner: "{{ config.owner }}"
    mode: '0644'

- name: Create AWS config directory
  file:
    state: directory
    path: "{{ app_user.home }}/.aws"
    owner: "{{ imap_s3_uploader_user }}"
    group: "{{ imap_s3_uploader_user }}"
    mode: '0700'

- name: Write AWS region
  copy:
    dest: "{{ app_user.home }}/.aws/config"
    content: |
      [default]
      region = {{ imap_s3_uploader_aws_region }}
    owner: "{{ imap_s3_uploader_user }}"
    group: "{{ imap_s3_uploader_user }}"
    mode: '0644'

- name: Write AWS credentials
  no_log: true
  copy:
    dest: "{{ app_user.home }}/.aws/credentials"
    content: |
      [default]
      aws_access_key_id = {{ secrets.aws.credentials.access_key }}
      aws_secret_access_key = {{ secrets.aws.credentials.secret_key }}
    owner: "{{ imap_s3_uploader_user }}"
    group: "{{ imap_s3_uploader_user }}"
    mode: '0600'

- name: Install systemd units
  loop: [imap-s3-uploader.service, imap-s3-uploader.timer]
  copy:
    remote_src: true
    src: "{{ imap_s3_uploader_root }}/etc/systemd/{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    mode: '0644'

- name: Enable imap-s3-uploader timer
  systemd_service:
    name: imap-s3-uploader.timer
    daemon_reload: true
    enabled: true
    state: started
